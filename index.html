<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô Analisador Do Guinho - Oficial</title>
    <style>
        /* TEMA E CORES */
        body {
            background: linear-gradient(135deg, #2b0044 0%, #000000 100%);
            color: #00ff41; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* TELA DE LOGIN */
        #login-screen {
            display: none;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border: 2px solid #00ff41;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 30px #00ff41;
        }

        /* CONTAINER PRINCIPAL */
        #main-content {
            display: none;
            max-width: 600px;
            margin: auto;
            border: 2px solid #8a2be2; 
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px #8a2be2;
        }

        h1 { color: #8a2be2; text-shadow: 2px 2px #000; }

        input[type="password"], select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #00ff41;
            background: #1a1a1a;
            color: white;
            font-weight: bold;
            box-sizing: border-box;
        }

        button {
            background: #8a2be2;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            text-transform: uppercase;
        }

        button:hover { background: #00ff41; color: black; }

        /* BOTÃO DEMO ESPECÍFICO */
        #btnDemo {
            background: #444;
            border: 1px dashed #00ff41;
            margin-top: 20px;
        }
        #btnDemo:hover:not(:disabled) { background: #555; }
        #btnDemo:disabled { cursor: not-allowed; opacity: 0.5; border-color: red; color: red; }

        /* ANIMAÇÃO DE CARREGAMENTO */
        #loading { display: none; margin-top: 20px; }
        .spinner {
            border: 4px solid rgba(138, 43, 226, 0.3);
            border-top: 4px solid #00ff41;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* RESULTADOS */
        #results {
            margin-top: 20px;
            display: none;
            text-align: center;
            padding: 15px;
            border-top: 1px solid #8a2be2;
            font-size: 1.2em;
        }

        footer { margin-top: 50px; font-size: 0.8em; color: #8a2be2; }
        #btnShare { background: #25d366; margin-top: 15px; }
    </style>
</head>
<body oncontextmenu="return false" onkeydown="bloquearTeclas(event)">

    <!-- TELA DE ACESSO -->
    <div id="login-screen">
        <h2 style="color: #00ff41;">ACESSO RESTRITO</h2>
        <p>Digite a senha para liberar o Robô:</p>
        <input type="password" id="senhaInput" placeholder="Sua Senha Aqui">
        <button onclick="verificarSenha()">ENTRAR NO SISTEMA</button>
        
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        
        <p style="font-size: 0.9em;">Ainda não tem a senha? Faça um teste:</p>
        <button id="btnDemo" onclick="ativarDemo()">TESTAR DEMONSTRAÇÃO</button>
        <p id="demoAviso" style="font-size: 0.8em; color: #aaa;"></p>
    </div>

    <!-- CONTEÚDO DO SITE -->
    <div id="main-content">
        <div id="demoBadge" style="display:none; background: orange; color: black; font-weight: bold; padding: 5px; border-radius: 5px; margin-bottom: 10px;">MODO DEMONSTRAÇÃO ATIVO</div>
        <h1>🤖 Robô Analisador Do Guinho</h1>
        <p>Análise de Loterias Ativada</p>

        <label>Escolha a Loteria:</label>
        <select id="loteria">
            <option value="Pt Rio">Pt Rio</option>
            <option value="Look Goiás">Look Goiás</option>
            <option value="Nacional">Nacional</option>
        </select>

        <label>Escolha a Modalidade:</label>
        <select id="modalidade">
            <option value="Milhar">Milhar</option>
            <option value="Centena">Centena</option>
            <option value="Dezena">Dezena</option>
            <option value="Terno de Grupo">Terno de Grupo</option>
        </select>

        <button onclick="iniciarAnalise()">ANALISAR AGORA</button>

        <div id="loading">
            <div class="spinner"></div>
            <p id="loadingText">Analisando sorteios...</p>
        </div>

        <div id="results">
            <h3 id="resTitle" style="color: #00ff41;"></h3>
            <div id="resList" style="color: #fff; font-weight: bold;"></div>
            <button id="btnShare" onclick="compartilhar()">Compartilhar Análise</button>
        </div>
    </div>

    <footer>
        Criado por Guinho Do Bicho
    </footer>

    <script>
        const LIMITE_DEMO = 3;

        window.onload = function() {
            // Se já tiver acesso total, entra direto
            if (localStorage.getItem("acessoGuinho") === "autorizado") {
                liberarAcesso(false);
            } else {
                document.getElementById('login-screen').style.display = 'block';
                atualizarInterfaceDemo();
            }
        };

        function atualizarInterfaceDemo() {
            let usos = parseInt(localStorage.getItem("contagemDemo") || "0");
            const btn = document.getElementById('btnDemo');
            const aviso = document.getElementById('demoAviso');
            
            if (usos >= LIMITE_DEMO) {
                btn.disabled = true;
                btn.innerText = "TESTES ESGOTADOS";
                aviso.innerText = "Você já usou seus 3 testes. Adquira a versão completa!";
                aviso.style.color = "red";
            } else {
                btn.innerText = `TESTAR DEMONSTRAÇÃO (${LIMITE_DEMO - usos} RESTANTES)`;
                aviso.innerText = "Você tem direito a 3 acessos de teste neste dispositivo.";
            }
        }

        function ativarDemo() {
            let usos = parseInt(localStorage.getItem("contagemDemo") || "0");
            
            if (usos < LIMITE_DEMO) {
                usos++;
                localStorage.setItem("contagemDemo", usos);
                liberarAcesso(true);
            }
        }

        function verificarSenha() {
            const senhaCorreta = "ROBOANALISADOR";
            const senhaDigitada = document.getElementById('senhaInput').value;

            if (senhaDigitada === senhaCorreta) {
                localStorage.setItem("acessoGuinho", "autorizado");
                liberarAcesso(false);
            } else {
                alert("Senha Incorreta! Acesso negado.");
            }
        }

        function liberarAcesso(isDemo) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            if (isDemo) {
                document.getElementById('demoBadge').style.display = 'block';
            } else {
                document.getElementById('demoBadge').style.display = 'none';
            }
        }

        // --- FUNÇÕES DE ANÁLISE (Mantidas Intactas) ---
        function pseudoRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function gerarNumeros(qtd, max, seedBase) {
            let nums = [];
            let seed = seedBase;
            while(nums.length < qtd) {
                let n = Math.floor(pseudoRandom(seed) * max);
                let formatado = n.toString().padStart(max === 10000 ? 4 : (max === 1000 ? 3 : 2), '0');
                if(!nums.includes(formatado)) nums.push(formatado);
                seed++;
            }
            return nums;
        }

        function iniciarAnalise() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            const loteria = document.getElementById('loteria').value;
            document.getElementById('loadingText').innerText = `Analisando sorteios da loteria ${loteria}...`;

            setTimeout(() => {
                exibirResultados();
            }, 8000); 
        }

        function exibirResultados() {
            document.getElementById('loading').style.display = 'none';
            const loteria = document.getElementById('loteria').value;
            const modalidade = document.getElementById('modalidade').value;
            const hoje = new Date().toISOString().slice(0, 10);
            let semente = 0;
            const strSemente = hoje + loteria + modalidade;
            for (let i = 0; i < strSemente.length; i++) { semente += strSemente.charCodeAt(i); }

            let quantidade = (modalidade === "Milhar") ? 12 : (modalidade === "Centena") ? 10 : (modalidade === "Dezena") ? 12 : 16;
            let maximo = (modalidade === "Milhar") ? 10000 : (modalidade === "Centena") ? 1000 : (modalidade === "Dezena") ? 100 : 25;

            const palpites = gerarNumeros(quantidade, maximo, semente);
            
            document.getElementById('resTitle').innerText = `Palpites para ${loteria} (${modalidade}):`;
            document.getElementById('resList').innerText = palpites.join(" - ");
            document.getElementById('results').style.display = 'block';
        }

        function compartilhar() {
            const listagem = document.getElementById('resList').innerText;
            const titulo = document.getElementById('resTitle').innerText;
            const textoParaEnviar = `As análises feita pelo robô do Guinho indicam essas combinações!\n\n${titulo}\n${listagem}`;

            if (navigator.share) {
                navigator.share({ text: textoParaEnviar }).catch(console.error);
            } else {
                navigator.clipboard.writeText(textoParaEnviar);
                alert("Análise copiada!");
            }
        }

        function bloquearTeclas(e) {
            if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 'U'.charCodeAt(0) || e.keyCode == 'S'.charCodeAt(0)))) {
                e.preventDefault();
                return false;
            }
        }
    </script>
</body>
</html>
